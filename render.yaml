services:
  # -------------------------------------------------------------------
  # 1. OmniStream Backend Engine (Next.js 14 App Router API)
  # -------------------------------------------------------------------
  - type: web
    name: omnistream-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run setup-bin && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # -------------------------------------------------------------------
  # 2. OmniStream Frontend Client (Angular 19 + Ionic PWA Static Site)
  # -------------------------------------------------------------------
  - type: web
    name: omnistream-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/app/browser
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/*
        destination: https://omnistream-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
