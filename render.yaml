services:
  # -------------------------------------------------------------------
  # 1. SA Downloader Backend Engine (Next.js 14 App Router API)
  # -------------------------------------------------------------------
  - type: web
    name: sadownloader-be
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run setup-bin && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # -------------------------------------------------------------------
  # 2. SA Downloader Frontend Client (Angular 19 + Ionic PWA Static Site)
  # -------------------------------------------------------------------
  - type: web
    name: sadownloader-fe
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/app/browser
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
